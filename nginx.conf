events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;
        server_name saikbiradar.in www.saikbiradar.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name saikbiradar.in www.saikbiradar.in;

        # Points to your main domain certificates
        ssl_certificate /etc/letsencrypt/live/saikbiradar.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/saikbiradar.in/privkey.pem;

        # Serve frontend files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # WebSocket proxy for FastAPI
        location /ws {
            proxy_pass http://backend:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    server {
        listen 80;
        server_name monitoring.saikbiradar.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
   
